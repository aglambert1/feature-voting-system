# Render Blueprint — defines all services for one-click deploy
# https://render.com/docs/blueprint-spec

services:
  # Backend API
  - type: web
    name: feature-iq-api
    plan: free
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: feature-iq-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: feature-iq-redis
          type: redis
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false  # Set manually in dashboard
      - key: BRAVE_API_KEY
        sync: false
      - key: DEBUG
        value: "false"
      - key: ALLOWED_ORIGINS
        value: "https://feature-iq.onrender.com"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  # Celery worker for background tasks
  - type: worker
    name: feature-iq-worker
    plan: free
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    dockerCommand: celery -A app.queue worker --loglevel=info --pool=solo
    envVars:
      - key: SECRET_KEY
        fromService:
          name: feature-iq-api
          type: web
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: feature-iq-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: feature-iq-redis
          type: redis
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: BRAVE_API_KEY
        sync: false
      - key: DEBUG
        value: "false"

  # Frontend static site
  - type: web
    name: feature-iq
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Redis for Celery message broker
  - type: redis
    name: feature-iq-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []  # Only internal services can connect

databases:
  - name: feature-iq-db
    plan: free
    databaseName: feature_iq
    postgresMajorVersion: "16"
